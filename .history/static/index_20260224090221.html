<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zororo Phumulani Funeral Policy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* MAIN CARD */
.form-container {
    width: 420px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    overflow: hidden;
}

/* GOLD BAR */
.gold-bar {
    height: 8px;
    background: linear-gradient(90deg,#c9a227,#f2d16b,#c9a227);
}

/* HEADER */
.form-header {
    text-align: center;
    padding: 25px 20px 10px 20px;
}

/* LOGO */
.logo {
    width: 70px;
    margin-bottom: 10px;
}

/* COMPANY NAME */
.company-name {
    font-size: 20px;
    font-weight: bold;
    color: #203a43;
}

.form-title {
    font-size: 16px;
    margin-top: 5px;
    color: #555;
}

/* SLIDE CONTENT */
.slide {
    padding: 20px;
}

.slide h3 {
    margin-bottom: 15px;
    color: #203a43;
}

/* INPUTS */
input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

/* FILE LABEL */
.file-label {
    font-size: 13px;
    margin-bottom: 5px;
    display: block;
    color: #333;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    background: #203a43;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #2c5364;
}

</style>
</head>

<body>

<div class="form-container">

    <div class="gold-bar"></div>

    <div class="form-header">
        <img src="/static/logo.png" class="logo">
        <div class="company-name">Zororo Phumulani</div>
        <div class="form-title">Funeral Policy Application</div>
    </div>

    <!-- FORM START -->
    <form enctype="multipart/form-data">

    <div class="slide">
        <h3>Personal Information</h3>

        <input type="text" placeholder="Full Name" required>
        <input type="date" required>
        <input type="text" placeholder="Passport / ID Number" required>
        <input type="tel" placeholder="Mobile Number" required>
        <input type="email" placeholder="Email Address" required>

        <!-- Country Dropdown -->
        <select required>
            <option value="">-- Select Country of Residence --</option>

            <optgroup label="SADC Region">
                <option>South Africa</option>
                <option>Zimbabwe</option>
                <option>Botswana</option>
                <option>Mozambique</option>
                <option>Zambia</option>
                <option>Namibia</option>
                <option>Lesotho</option>
                <option>Eswatini</option>
                <option>Malawi</option>
                <option>Angola</option>
            </optgroup>

            <optgroup label="Overseas">
                <option>European Union</option>
                <option>Australia</option>
                <option>Canada</option>
                <option>USA</option>
                <option>New Zealand</option>
                <option>France</option>
            </optgroup>
        </select>

        <!-- ID Upload -->
        <label class="file-label">Upload Passport / ID (PDF, JPG, PNG – Max 5MB)</label>
        <input type="file" accept=".pdf,.jpg,.jpeg,.png" required>

        <button type="submit">Continue</button>
    </div>

    </form>
    <!-- FORM END -->

</div>

</body>
</html>
