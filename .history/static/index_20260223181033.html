<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zororo Phumulani Funeral Policy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* MAIN CARD */
.form-container {
    width: 420px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    overflow: hidden;
}

/* GOLD BAR */
.gold-bar {
    height: 8px;
    background: linear-gradient(90deg,#c9a227,#f2d16b,#c9a227);
}

/* HEADER */
.form-header {
    text-align: center;
    padding: 25px 20px 10px 20px;
}

/* LOGO */
.logo {
    width: 70px;
    margin-bottom: 10px;
}

/* COMPANY NAME */
.company-name {
    font-size: 20px;
    font-weight: bold;
    color: #203a43;
}

.form-title {
    font-size: 16px;
    margin-top: 5px;
    color: #555;
}

/* SLIDE CONTENT */
.slide {
    padding: 20px;
}

.slide h3 {
    margin-bottom: 15px;
    color: #203a43;
}

/* INPUTS */
input {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    background: #203a43;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #2c5364;
}

</style>
</head>

<body>

<div class="form-container">

    <div class="gold-bar"></div>

    <div class="form-header">
        <!-- REPLACE logo.png with your actual logo file -->
        <img src="/static/logo.png" class="logo">
        <div class="company-name">Zororo Phumulani</div>
        <div class="form-title">Funeral Policy Application</div>
    </div>

    <div class="slide">
        <h3>Personal Information</h3>

        <input type="text" placeholder="Full Name">
        <input type="date" placeholder="Date of Birth">
        <input type="text" placeholder="Passport / ID Number">
        <input type="tel" placeholder="Mobile Number">
        <input type="email" placeholder="Email Address">

        <button>Continue</button>
    </div>

</div>

</body>
</html>
