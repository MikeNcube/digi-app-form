<form id="applicationForm">

  <select id="planType" name="plan_type" onchange="updatePlans()" required>
    <option value="">Select Plan Type</option>
    <option value="Family">Family</option>
    <option value="Single">Single</option>
  </select>

  <select id="planPrice" name="plan_price" required>
    <option value="">Select Plan Price</option>
  </select>

  <button type="submit" id="submitBtn">Submit Application</button>

</form>

<script>
function updatePlans() {
  const type = document.getElementById("planType").value;
  const price = document.getElementById("planPrice");
  const dependentsSlide = document.getElementById("dependentsSlide");

  price.innerHTML = '<option value="">Select Plan Price</option>';

  if (type === "Family") {
    price.innerHTML += `
      <option value="R540">R540</option>
      <option value="R720">R720</option>
      <option value="R1080">R1080</option>
    `;
    if (dependentsSlide) dependentsSlide.style.display = "block";
  }

  if (type === "Single") {
    price.innerHTML += `
      <option value="R450">R450</option>
      <option value="R630">R630</option>
      <option value="R990">R990</option>
    `;
    if (dependentsSlide) dependentsSlide.style.display = "none";
  }
}

document.getElementById("applicationForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.innerText = "Submitting...";

  const formData = new FormData(this);
  const data = {};

  formData.forEach((value, key) => {
    data[key] = value;
  });

  try {
    const response = await fetch("https://digi-app-form-production.up.railway.app/apply", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    if (!response.ok) {
      throw new Error("Server error");
    }

    const result = await response.json();

    alert("Application submitted successfully!");
    console.log(result);

    this.reset();
    document.getElementById("planPrice").innerHTML = '<option value="">Select Plan Price</option>';

  } catch (error) {
    alert("Submission failed. Please try again.");
    console.error(error);
  }

  submitBtn.disabled = false;
  submitBtn.innerText = "Submit Application";
});
</script>
