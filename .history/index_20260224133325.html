<form id="applicationForm">

  <select id="planType" name="plan_type" onchange="updatePlans()" required>
    <option value="">Select Plan Type</option>
    <option value="Family">Family</option>
    <option value="Single">Single</option>
  </select>

  <select id="planPrice" name="plan_price" required></select>

  <button type="submit">Submit Application</button>

</form>

<script>
function updatePlans(){
  const type = document.getElementById("planType").value;
  const price = document.getElementById("planPrice");

  price.innerHTML = "";

  if(type === "Family"){
    price.innerHTML = `
      <option value="R540">R540</option>
      <option value="R720">R720</option>
      <option value="R1080">R1080</option>
    `;
    document.getElementById("dependentsSlide").style.display = "block";
  }

  if(type === "Single"){
    price.innerHTML = `
      <option value="R450">R450</option>
      <option value="R630">R630</option>
      <option value="R990">R990</option>
    `;
    document.getElementById("dependentsSlide").style.display = "none";
  }
}

document.getElementById("applicationForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const formData = new FormData(this);
  const data = {};

  formData.forEach((value, key) => {
    data[key] = value;
  });

  try {
    const response = await fetch("https://digi-app-form-production.up.railway.app/apply", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();
    alert("Application submitted successfully!");
    console.log(result);

  } catch (error) {
    alert("Submission failed.");
    console.error(error);
  }
});
</script>
